name: Publish Qalandar Portfolio
on:
  push:
    branches: [main]
    paths:
      - 'Qalandar_Portfolio_Publish_Ready.zip'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract portfolio
        run: |
          mkdir -p _site
          unzip -q Qalandar_Portfolio_Publish_Ready.zip -d _site
          test -f _site/index.html
          test -f _site/style.css
          test -f _site/script.js
          test -f _site/translations.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
